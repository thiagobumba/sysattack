# SysAttack - modelo de config.properties (renomeie para config.properties)
# Salve este arquivo na pasta de dados do SysAttack (ex.: C:\Users\SEU_USUARIO\.sysattack\)
# com o nome exato "config.properties" (sem .txt). Reinicie o Tomcat depois de alterar.
# Linhas iniciadas com # são comentários. Não use aspas nem espaços em volta do "=".
# Em caminhos do Windows, use barra normal (D:/backups) ou barra dupla (D:\\backups).

# ---------------------------------------------------------------
# Endereço do sistema (aparece no e-mail de boas-vindas)
# Use o IP fixo ou o nome do servidor, a porta e o nome do .war. Sem barra no final.
# ---------------------------------------------------------------
app.url=http://192.168.31.70:8085/sysattack

# ---------------------------------------------------------------
# E-mail (SMTP) - envio de convites, códigos de senha e relatórios
# Para Microsoft 365 / Outlook use uma conta dedicada e, se houver
# verificação em duas etapas, uma "senha de aplicativo".
# ---------------------------------------------------------------
smtp.host=smtp.office365.com
smtp.port=587
smtp.security=starttls
smtp.user=sysattack@momesso.ind.br
#smtp.password=COLOQUE_A_SENHA_AQUI  (opcional: só se o servidor SMTP exigir senha)
smtp.from=sysattack@momesso.ind.br

# Somente para TESTE sem e-mail (o link/código aparece no log do Tomcat).
# Não use em produção. Para ativar, remova o # e comente as linhas smtp.* acima.
#smtp.dev=true

# ---------------------------------------------------------------
# Backups (opcional, mas recomendado)
# backup.dir: outro disco que não o do banco.
# backup.mirror: segunda cópia em outra máquina/rede.
# ---------------------------------------------------------------
#backup.dir=D:/backups/sysattack
#backup.mirror=//servidor/backups/sysattack
